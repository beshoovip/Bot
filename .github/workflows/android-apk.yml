name: Build Android APK
# تشغيل يدوي من تبويب Actions على الجوال: اختر "Build Android APK" ثم Run workflow.
# أدخل عنوان الخادم (https://...) ليُضمَّن كإعداد افتراضي داخل التطبيق (يمكن تغييره لاحقًا من شاشة الدخول).
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'عنوان الخادم، مثال https://my-game.onrender.com'
        required: false
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install client dependencies
        working-directory: client
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build web assets
        working-directory: client
        env:
          VITE_SERVER_URL: ${{ inputs.server_url || vars.SERVER_URL || '' }}
        run: npm run build
      - name: Add Android platform
        working-directory: client
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          # إجبار الاتجاه الأفقي
          sed -i 's|<activity |<activity android:screenOrientation="sensorLandscape" |' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK exists
        run: |
          APK=$(ls client/android/app/build/outputs/apk/debug/*.apk | head -n1)
          test -s "$APK"
          ls -l "$APK"
          unzip -l "$APK" | grep -E "assets/public/index.html"
          cp "$APK" caravan-road-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: caravan-road-debug-apk
          path: caravan-road-debug.apk
          retention-days: 30
      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: caravan-road-debug.apk
