name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node scripts/check-syntax.mjs
      - name: Unit tests (shared, server, client logic)
        run: npm test
      - name: Database tests (real PostgreSQL)
        run: npm run test:db
      - name: Integration tests (game engine on real PostgreSQL)
        run: npm run test:integration
      - name: UI tests (Chromium)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run test:ui
